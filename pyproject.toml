[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-barrage"
version = "1.1.0a0"
description = "A clean-room fixed-shooter arcade game built with Python and Pygame."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pygame==2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller==6.22.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
